# Local development dependencies. The application itself runs on the host
# (./mvnw spring-boot:run) so that restarts are instant during development;
# only the stateful service lives in a container.
#
# Versions are pinned to a minor release, not `latest`: a reconciliation job is
# sensitive to query planner behaviour, and the Step 10 EXPLAIN numbers are only
# meaningful if everyone runs the same Postgres.
#
# There is no Redis here, and that is a decision rather than an omission. It was
# the obvious place to put idempotency keys - SETNX is one round trip and far
# faster than an INSERT. It is not used because a second system can disagree with
# the database: if Redis grants a key and the transaction then rolls back the key
# is burned, and if Redis loses a key to eviction or a failover the payer is
# charged twice. The unique index lives in the same transaction as the money and
# cannot contradict it. Redis earns its place in front of this as a rate limiter,
# not underneath it as the source of truth.

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: prs-postgres
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      # Deterministic collation: index ordering for text columns depends on it.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images store data in a major-version-specific subdirectory
      # (/var/lib/postgresql/18/docker) so that "pg_upgrade --link" works without
      # crossing a mount boundary. The volume therefore mounts the parent, not
      # .../data - mounting .../data makes the entrypoint abort at startup.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
